name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (formatação)
        run: ruff format --check .

      - name: Flake8 (estilo e complexidade)
        run: flake8 --max-complexity 12 src tests streamlit_app.py

      - name: Mypy (tipos)
        run: mypy src --ignore-missing-imports

      - name: Pytest + cobertura
        run: pytest --cov=src --cov-report=term-missing

  docker:
    name: Docker (build + testes no container)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker compose build

      - name: Rodar os testes dentro do container
        run: docker compose run --rm python-ml pytest --cov=src --cov-report=term-missing
